
kind: pipeline
type: docker
name: default

trigger:
  ref:
    - refs/heads/drone
    - refs/pull/**
    - refs/tags/**

steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    restore: true
    mount:
      - .stack-work
      - .stack
      - dist
    volumes:
      - name: cache
        path: /var/lib/cache
    when:
      event: [push, pull_request, tag, deployment]

  - name: deps
    image: registry.digitalocean.com/stewcasa/haskell-build:2
    environment:
      STACK_ROOT: /drone/src/github.com/stew/unison/.stack
    commands:
      - mkdir -p .stack
      - stack build --test --only-dependencies

  - name: build
    image: registry.digitalocean.com/stewcasa/haskell-build:2
    environment:
      STACK_ROOT: /drone/src/github.com/stew/unison/.stack
    commands:
      - stack build
      - stack test
      - stack exec transcripts

  - name: build-cache
    group: post-build
    image: drillster/drone-volume-cache
    rebuild: true
    mount:
      - ./.stack-work
      - ./.stack
      - dist
    volumes:
      - name: cache
        path: /var/lib/cache
    when:
      branch: drone
      status: [ success ]
