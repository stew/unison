
kind: pipeline
type: docker
name: default

trigger:
  ref:
    - refs/heads/drone
    - refs/pull/**
    - refs/tags/**

volumes:
  - name: cache
    host:
      path: /tmp/cache
    
steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    settings:
      pull: true
      restore: true
      mount:
        - stack
    volumes:
      - name: cache
        path: /cache

  - name: deps
    image: registry.digitalocean.com/stewcasa/haskell-build:3
    commands:
      - mkdir -p stack
      - stack --stack-root $PWD/stack build --test --only-dependencies

  - name: cache-deps
    group: post-build
    image: drillster/drone-volume-cache
    settings:
      rebuild: true
      mount:
        - stack
      when:
        event: push
    volumes:
      - name: cache
        path: /cache

  - name: build
    image: registry.digitalocean.com/stewcasa/haskell-build:3
    commands:
      - stack --stack-root $PWD/stack build
      - stack --stack-root $PWD/stack test
      - stack --stack-root $PWD/stack exec transcripts

  - name: publish
    image: registry.digitalocean.com/stewcasa/haskell-build:3
    commands:
      - stack --stack-root $PWD/stack build
      - stack --stack-root $PWD/stack test
      - stack --stack-root $PWD/stack exec transcripts

  - name: cache-build
    group: post-build
    image: drillster/drone-volume-cache
    settings:
      rebuild: true
      mount:
        - stack
      when:
        event: push
    volumes:
      - name: cache
        path: /cache

  - name: publish-build
    group: post-build
    image: registry.digitalocean.com/stewcasa/haskell-build:3
    commands:
      - cd $(stack path | awk '/local-install-root/{print $2}')/bin
      - mv unison ucm
      - export ARCHIVE=unison-$(date +%F).tar.gz
      - tar czf $ARCHIVE ucm
      - vault ssh -mode=ca -role=upload upload@172.18.0.8 of=$ARCHIVE < $ARCHIVE
      
volumes:
    - name: cache
      host:
        path: /tmp/cache2
        


