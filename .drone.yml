---
kind: pipeline
type: docker
name: default

trigger:
  ref:
    - refs/heads/drone
    - refs/pull/**
    - refs/tags/**



steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    settings:
      pull: true
      restore: true
      mount:
        - stack
    volumes:
      - name: cache
        path: /cache

  - name: deps
    image: registry.digitalocean.com/stewcasa/haskell-build:5
    volumes:
      - name: root_home
        path: /root
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - mkdir -p stack
      - stack --work-dir stack --stack-root $PWD/stack build --test --only-dependencies

  - name: cache-deps
    group: post-build
    image: drillster/drone-volume-cache
    settings:
      rebuild: true
      mount:
        - stack
      when:
        event: push
    volumes:
      - name: cache
        path: /cache

  - name: build
    image: registry.digitalocean.com/stewcasa/haskell-build:5
    settings:
      mount:
        - stack
    commands:
      - stack --work-dir stack --stack-root $PWD/stack build
      - stack --work-dir stack --stack-root $PWD/stack test
      - stack --work-dir stack --stack-root $PWD/stack exec transcripts

  - name: cache-build
    group: post-build
    image: drillster/drone-volume-cache
    settings:
      rebuild: true
      mount:
        - stack
      when:
        event: push
    volumes:
      - name: cache
        path: /cache

  - name: publish-build
    group: post-build
    image: registry.digitalocean.com/stewcasa/haskell-build:5
    commands:
      - cd $(stack --work-dir stack --stack-root $PWD/stack path | awk '/local-install-root/{print $2}')/bin
      - mv unison ucm
      - export ARCHIVE=unison-$(date +%F).tar.gz
      - tar czf $ARCHIVE ucm
      - vault ssh -mode=ca -role=upload upload@172.18.0.8 of=$ARCHIVE < $ARCHIVE
    volumes:
      - name: root_home
        path: /root
      
volumes:
    - name: cache
      host:
        path: /tmp/cache2
    - name: docker_sock
      host:
        path: /var/run/docker.sock

    - name: root_home
      host:
        path: /root
