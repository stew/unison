
kind: pipeline
type: docker
name: default

trigger:
  ref:
    - refs/heads/drone
    - refs/pull/**
    - refs/tags/**

volumes:
  - name: cache
    host:
      path: /tmp/cache
    
steps:
  - name: restore-cache
    image: plugins/s3-cache
    settings:
      pull: true
      restore: true
      endpoint: https://drone-stack-cache.sfo3.digitaloceanspaces.com
      access_key:
        from_secret: SPACES_ACCESS_ID
      secret_key:
        from_secret: SPACES_SECRET_KEY

  - name: deps
    image: registry.digitalocean.com/stewcasa/haskell-build:2
    environment:
      STACK_ROOT: /drone/src/github.com/stew/unison/.stack
    commands:
      - stack build --test --only-dependencies

  - name: cache-deps
    group: post-build
    image: plugins/s3-cache
    settings:
      rebuild: true
      endpoint: https://drone-stack-cache.sfo3.digitaloceanspaces.com
      access_key:
        from_secret: SPACES_ACCESS_ID
      secret_key:
        from_secret: SPACES_SECRET_KEY
      mount:
        - .stack
        - .stack-work
      when:
        event: push

  - name: build
    image: registry.digitalocean.com/stewcasa/haskell-build:2
    environment:
      STACK_ROOT: /drone/src/github.com/stew/unison/.stack
    commands:
      - stack build
      - stack test
      - stack exec transcripts

